services:
  postgres:
    # pgvector/pgvector:pg15 = stock Postgres 15 + the pgvector extension
    # pre-installed. Needed for the AI agent's embedding search (DEV-204) -
    # plain postgres:15-alpine can't run `CREATE EXTENSION vector`.
    image: pgvector/pgvector:pg15
    container_name: dc_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: developer_companion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - infrastructure
      - backend

  ai-agent:
    build: ../../services/ai-agent-service
    container_name: dc_ai_agent
    ports:
      - "8000:8000"
    profiles:
      - ai
      - fullstack

volumes:
  postgres_data: